name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: bash scripts/ci-annotate.sh Test bash scripts/test.sh
      - name: Universal build
        run: bash scripts/ci-annotate.sh Build bash scripts/build.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test/Logs/Test/*.xcresult
          retention-days: 7
